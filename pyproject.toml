[project]
name = "b3-mcp-server"
version = "0.1.0"
description = "MCP Server para análise do mercado de ações brasileiro (B3/Bovespa) com Hi-Lo Activator"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.12.0",
    "tradingview-screener>=0.6.4",
    "tradingview-ta>=3.3.0",
    "feedparser>=6.0.12",
    "requests>=2.31.0",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
b3-mcp = "b3_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/b3_mcp"]
